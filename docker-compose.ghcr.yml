services:
  meeting:
    image: ${MEETING_RECORDER_IMAGE:?Set MEETING_RECORDER_IMAGE to a GHCR image tag}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    secrets:
      - openrouter_api_key
    volumes:
      - ./sessions:/data

secrets:
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt
