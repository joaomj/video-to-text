services:
  meeting:
    build:
      context: .
      dockerfile: Dockerfile
    image: meeting-recorder:latest
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    secrets:
      - openrouter_api_key
    volumes:
      - ./sessions:/data

secrets:
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt
