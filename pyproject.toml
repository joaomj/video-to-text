[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-recorder"
version = "0.5.0"
description = "Record meetings (microphone plus system audio) and transcribe them with OpenRouter"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0",
    "python-dotenv",
]

[project.scripts]
meeting = "transcribe_diarize_app.meeting_cli:main"

[dependency-groups]
dev = ["ruff>=0.15.6"]
test = ["pytest>=9.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["transcribe_diarize_app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "PTH",
    "ERA",
    "PL",
    "RUF",
    "S",
    "NPY",
]

[tool.ruff.lint.pylint]
max-args = 7
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
